<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="calculator">
      <h1 class="visually-hidden">Calculator</h1>

      <section class="display" aria-label="calculator display">
        <div class="display-previous" id="previous-operand"></div>
        <div class="display-current" id="current-operand">0</div>
      </section>

      <section class="keypad" aria-label="calculator buttons">
        <button type="button" class="btn btn-clear" data-action="clear">
          <span>AC</span>
        </button>
        <button type="button" class="btn btn-delete" data-action="delete">
          <span>DEL</span>
        </button>
        <button type="button" class="btn" data-action="percent">
          <span>%</span>
        </button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="/"
        >
          <span>÷</span>
        </button>

        <button type="button" class="btn btn-number" data-value="7">
          <span>7</span>
        </button>
        <button type="button" class="btn btn-number" data-value="8">
          <span>8</span>
        </button>
        <button type="button" class="btn btn-number" data-value="9">
          <span>9</span>
        </button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="*"
        >
          <span>×</span>
        </button>

        <button type="button" class="btn btn-number" data-value="4">
          <span>4</span>
        </button>
        <button type="button" class="btn btn-number" data-value="5">
          <span>5</span>
        </button>
        <button type="button" class="btn btn-number" data-value="6">
          <span>6</span>
        </button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="-"
        >
          <span>−</span>
        </button>

        <button type="button" class="btn btn-number" data-value="1">
          <span>1</span>
        </button>
        <button type="button" class="btn btn-number" data-value="2">
          <span>2</span>
        </button>
        <button type="button" class="btn btn-number" data-value="3">
          <span>3</span>
        </button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="+"
        >
          <span>+</span>
        </button>

        <button type="button" class="btn btn-number btn-zero" data-value="0">
          <span>0</span>
        </button>
        <button type="button" class="btn btn-number" data-value=".">
          <span>.</span>
        </button>
        <button type="button" class="btn btn-equals" data-action="calculate">
          <span>=</span>
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

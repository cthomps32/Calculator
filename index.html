<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="/main.js"></script>
  </head>
  <body>
    <main class="calculator">
      <h1 class="visually-hidden">Calculator</h1>

      <section class="display" aria-label="calculator display">
        <div class="display-previous" id="previous-operand"></div>
        <div class="display-current" id="current-operand">0</div>
      </section>

      <section class="keypad" aria-label="calculator buttons">
        <button type="button" class="btn btn-clear" data-action="clear">
          AC
        </button>
        <button type="button" class="btn btn-delete" data-action="delete">
          DEL
        </button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="/"
        >
          ÷
        </button>

        <button type="button" class="btn btn-number" data-value="7">7</button>
        <button type="button" class="btn btn-number" data-value="8">8</button>
        <button type="button" class="btn btn-number" data-value="9">9</button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="*"
        >
          ×
        </button>

        <button type="button" class="btn btn-number" data-value="4">4</button>
        <button type="button" class="btn btn-number" data-value="5">5</button>
        <button type="button" class="btn btn-number" data-value="6">6</button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="-"
        >
          −
        </button>

        <button type="button" class="btn btn-number" data-value="1">1</button>
        <button type="button" class="btn btn-number" data-value="2">2</button>
        <button type="button" class="btn btn-number" data-value="3">3</button>
        <button
          type="button"
          class="btn btn-operator"
          data-action="operator"
          data-value="+"
        >
          +
        </button>

        <button type="button" class="btn btn-number btn-zero" data-value="0">
          0
        </button>
        <button type="button" class="btn btn-number" data-value=".">.</button>
        <button type="button" class="btn btn-equals" data-action="calculate">
          =
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
